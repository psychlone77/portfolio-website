<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <style>
      :root {
        --ink-block: #1b1a1a;
        --ink-cutout: #fcecec;
        --border-color: #1b1a1a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink-block: #f4e4e4;
          --ink-cutout: #1b1a1a;
          --border-color: #f4e4e4;
        }
      }
      .stamp-block {
        fill: var(--ink-block);
        stroke: var(--border-color);
        stroke-width: 1;
      }
      .monogram {
        fill: var(--ink-cutout);
      }
    </style>
  </defs>
